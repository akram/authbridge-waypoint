# Minimal Envoy configuration for e2e testing
# This allows the envoy-proxy sidecar to start without errors
admin:
  address:
    socket_address:
      protocol: TCP
      address: 127.0.0.1
      port_value: 9901

static_resources:
  listeners:
  - name: outbound_listener
    address:
      socket_address:
        protocol: TCP
        address: 0.0.0.0
        port_value: 15123
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: outbound_tcp
          cluster: passthrough

  clusters:
  - name: passthrough
    connect_timeout: 5s
    type: ORIGINAL_DST
    lb_policy: CLUSTER_PROVIDED
