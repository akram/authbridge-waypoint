# OpenShift S2I (Go) builds — resources live in kagenti-images, not agent-ns.
#
# Why: agent-ns is often labeled istio.io/dataplane-mode=ambient. Build pods in that namespace
# are captured by ztunnel; pushes to image-registry.openshift-image-registry.svc frequently
# fail (DNS/connect timeouts) while the same BuildConfigs in kagenti-images work.
#
# Prerequisites:
#   - Namespace kagenti-images exists (builds + output ImageStreams + go-toolset IST).
#   - Apply image-puller-bindings.yaml so agent-ns / tool-ns / kagenti-system SAs can pull.
#   - import-image if needed:
#     oc import-image go-toolset:latest --from=registry.access.redhat.com/ubi9/go-toolset:latest --confirm -n kagenti-images
#
# Workload images (OpenShift): set each Deployment to
#   image-registry.openshift-image-registry.svc:5000/kagenti-images/<name>:latest
# Kind/local flows in deploy/08-workloads.yaml keep using localhost:5000 via Makefile.
#
# Adjust spec.source.git if you use another fork.
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: go-toolset
  namespace: kagenti-images
  labels:
    app.kubernetes.io/component: s2i-builder
spec:
  lookupPolicy:
    type: Local
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi9/go-toolset:latest
      referencePolicy:
        type: Local
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: demo-agent
  namespace: kagenti-images
  labels:
    app: demo-agent
spec: {}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: echo-tool
  namespace: kagenti-images
  labels:
    app: echo-tool
spec: {}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: time-tool
  namespace: kagenti-images
  labels:
    app: time-tool
spec: {}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: token-exchange-service
  namespace: kagenti-images
  labels:
    app: token-exchange-service
spec: {}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: demo-agent
  namespace: kagenti-images
  labels:
    app: demo-agent
spec:
  source:
    type: Git
    git:
      uri: https://github.com/akram/authbridge-waypoint.git
      ref: main
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: ImageStreamTag
        name: go-toolset:latest
        namespace: kagenti-images
      env:
        - name: GO_BUILD_PATH
          value: ./cmd/demo-agent
        - name: CGO_ENABLED
          value: "0"
  output:
    to:
      kind: ImageStreamTag
      name: demo-agent:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
      imageChange:
        from:
          kind: ImageStreamTag
          name: go-toolset:latest
          namespace: kagenti-images
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
