# Allow workload namespaces to pull images built into kagenti-images ImageStreams.
# Apply in the cluster after golang-s2i-buildconfigs.yaml (same project: bindings live in kagenti-images).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: authbridge-waypoint-pullers
  namespace: kagenti-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
  - kind: ServiceAccount
    name: default
    namespace: agent-ns
  - kind: ServiceAccount
    name: demo-agent
    namespace: agent-ns
  - kind: ServiceAccount
    name: default
    namespace: tool-ns
  - kind: ServiceAccount
    name: default
    namespace: kagenti-system
